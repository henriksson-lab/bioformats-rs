[package]
name = "bioformats"
version = "0.1.10"
edition = "2021"
description = "Pure Rust translation of Bio-Formats — read/write scientific image formats"
# Describes the default/full build (matches upstream Bio-Formats' own
# GPL-2.0-or-later `formats-gpl` module, which this crate's `gpl` feature
# mirrors and includes by default). Building with `--no-default-features` and
# leaving `gpl` disabled excludes all GPL-derived reader code and yields a
# BSD-2-Clause-only binary; see README.md for details. Cargo has no
# per-feature license field, so that distinction can't be expressed here.
license = "GPL-2.0-or-later"
homepage = "https://www.openmicroscopy.org/bio-formats/"
repository = "https://github.com/henriksson-lab/bioformats-rs"
readme = "README.md"
keywords = ["microscopy", "bioformats", "image", "tiff", "ome"]
categories = ["science", "multimedia::images", "parser-implementations"]
autotests = false
autoexamples = false
include = [
    "/src/**/*.rs",
    "/src/**/*.txt",
    "/src/metakit/tests/data/test.mk",
    "/tests/**/*.rs",
    "/examples/lossless_jpeg_crop.rs",
    "/benches/read_ome_tiff.rs",
    "/README.md",
    "/bioformats_bug.txt",
    "/LICENSE.txt",
]

[workspace]
resolver = "2"
members = ["."]
exclude = ["bench"]

[dependencies]
thiserror    = "2"
log          = "0.4"
hdf5-pure-rust = { version = "0.3", features = ["lz4"] }
zip          = { version = "2", default-features = false, features = ["deflate", "deflate64", "lzma", "aes-crypto", "time"] }
flate2       = "1"
weezl        = "0.2"
jpeg-decoder = "0.3"
zune-jpeg    = "0.5"
zune-core    = "0.5"
zstd-pure-rs = "0.1"
quick-xml    = "0.40"
encoding_rs  = "0.8"
cfb          = "0.14"
byteorder    = "1"
image        = { version = "0.25", default-features = false, features = ["png", "bmp", "jpeg", "gif", "tga", "webp", "pnm", "hdr", "exr", "dds", "ff"] }
openjp2      = { package = "openjpeg2-pure-rs", version = "0.1.1" }
serde         = { version = "1", features = ["derive"] }
bincode       = "1"
jpegxr = { package = "jpegxr-pure-rs", version = "0.1", optional = true }
openslide-pure-rs = { git = "https://github.com/henriksson-lab/openslide-pure-rs", optional = true }
mdbtools      = { package = "mdbtools-pure-rs", version = "0.1" }
bzip2 = "0.6"
zarrs         = { version = "0.23", features = ["filesystem"], optional = true }
serde_json    = { version = "1", features = ["preserve_order"] }
rusqlite      = { version = "0.40", features = ["bundled"], optional = true }

# Clippy lints that fight the translation parity rule in CLAUDE.md: the code is
# deliberately shaped like the upstream Java Bio-Formats source so it can be
# audited line by line. Each of these asks for a Rust idiom that compiles to the
# same thing but hides the Java structure, so they are allowed rather than fixed.
[lints.clippy]
# Java writes `X x = new X(); x.field = ...;`, not a struct literal.
field_reassign_with_default = "allow"
# Java indexes with `for (int i = 0; i < n; i++)`; the index is often used for
# more than one array, or for the bounds arithmetic around it.
needless_range_loop = "allow"
explicit_counter_loop = "allow"
# Signatures mirror Java method signatures argument for argument.
too_many_arguments = "allow"
type_complexity = "allow"
large_enum_variant = "allow"
only_used_in_recursion = "allow"
# Java arithmetic spelled out: `x % n == 0`, `(a + b - 1) / b`, `a > b - 1`,
# explicit min/max pairs and manual overflow guards. These lower identically.
manual_is_multiple_of = "allow"
manual_div_ceil = "allow"
manual_checked_ops = "allow"
manual_saturating_arithmetic = "allow"
manual_clamp = "allow"
manual_range_contains = "allow"
manual_range_patterns = "allow"
unnecessary_min_or_max = "allow"
int_plus_one = "allow"
identity_op = "allow"
# Control flow follows the Java nesting so branches line up with the original.
collapsible_if = "allow"
collapsible_match = "allow"
if_same_then_else = "allow"
# Java's `while (true) { ...; if (...) break; }` loops, several of which have
# more than one exit and so do not fold into a single `while let`.
while_let_loop = "allow"
# Java declares the variable before the branch that assigns it.
needless_late_init = "allow"
# Several translated readers keep `mod tests` next to the code it covers rather
# than at the end of the file; moving them would churn thousands of lines.
items_after_test_module = "allow"

[features]
default = ["jpegxr", "zarr", "tissuefaxs", "tecan", "gpl"]
jpegxr = ["dep:jpegxr"]
openslide = ["dep:openslide-pure-rs"]
zarr = ["dep:zarrs"]
# TissueFAXS (.aqproj/.tfcyto) reads SQLite project databases.
tissuefaxs = ["dep:rusqlite"]
# Tecan Spark Cyto (.db) reads SQLite plate databases (GPL reader; also needs `gpl`).
tecan = ["dep:rusqlite"]
# Readers ported from upstream Bio-Formats' GPL-2.0-or-later `formats-gpl`
# module. Disabling this (via --no-default-features) excludes all GPL-derived
# reader source from compilation, leaving only the BSD-2-Clause readers
# ported from upstream's `formats-bsd` module. See README.md.
gpl = []

[[bin]]
name = "bioformats-convert"
path = "src/bin/bioformats_convert.rs"

[[test]]
name = "java_parity_test"
path = "tests/java_parity_test.rs"

[[test]]
name = "write_test"
path = "tests/write_test.rs"

[[test]]
name = "java_writer_parity_test"
path = "tests/java_writer_parity_test.rs"

[[test]]
name = "new_features_test"
path = "tests/new_features_test.rs"

[[test]]
name = "non_upstream_readers_test"
path = "tests/non_upstream_readers_test.rs"

[[test]]
name = "lavision_stage_test"
path = "tests/lavision_stage_test.rs"

[[test]]
name = "stub_cellworx_test"
path = "tests/stub_cellworx_test.rs"

[[test]]
name = "xlef_metadata_test"
path = "tests/xlef_metadata_test.rs"

[[test]]
name = "slidebook7_sldyz_test"
path = "tests/slidebook7_sldyz_test.rs"

[[test]]
name = "slidebook7_yaml_metadata_test"
path = "tests/slidebook7_yaml_metadata_test.rs"

[[test]]
name = "zarr_test"
path = "tests/zarr_test.rs"

[[test]]
name = "picoquant_ptu_metadata_test"
path = "tests/picoquant_ptu_metadata_test.rs"

[[bench]]
name = "read_ome_tiff"
harness = false

[[example]]
name = "lossless_jpeg_crop"
path = "examples/lossless_jpeg_crop.rs"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
serde_json = { version = "1", features = ["preserve_order"] }
